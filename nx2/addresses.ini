# (Mako 4.2: every address left empty: nothing of Mako's players goes to Longshot's services)
# Where Hookshot's tools send things, and the pages they link to: the one place to edit when a service moves.
# Read by nx2/addresses.py (address(key)). A key left out or empty turns that use off: nothing is sent, and what was
# waiting stays for next time.
[addresses]
# Hookshot-api's telemetry (/telemetry/crash): POST a crash report (the crash window's Report automatically)
crash_reports =
# The issue the crash reports are posted on: the Sent box's link (only a link to this issue or one of its comments)
crash_issue =
# Hookshot-api's telemetry (/telemetry/perf): POST a performance summary (the launcher's Send performance statistics)
perf_reports =
