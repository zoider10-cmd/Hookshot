  vulkan-dlss:
    executor: py312-large
    retention:
      caches: 5d
    steps:
      - mb/get-source:
          fork-pr: << pipeline.parameters.fork_pr >>
          fork-sha: "<< pipeline.parameters.fork_sha >>"
          repo-url: "https://git.magicbean.dev/<< pipeline.git.repo_owner >>/<< pipeline.git.repo_name >>.git"
      - llvm-mingw
      - run:
          name: Pinned header trees for Windows Vulkan
          command: |
            set -euo pipefail
            scripts/fetch_commit.sh https://github.com/KhronosGroup/Vulkan-Headers 74d8a6cb930c68ef617b202c3ff3c59d919e086b _deps/cpm/vulkanheaders/v1.4.345
            scripts/fetch_commit.sh https://github.com/KhronosGroup/SPIRV-Headers 04f10f650d514df88b76d25e83db360142c7b174 _deps/cpm/spirv-headers/vulkan-sdk-1.4.341.0
            scripts/fetch_commit.sh https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator 1d8f600fd424278486eade7ed3e877c99f0846b1 _deps/cpm/vulkanmemoryallocator/v3.3.0
            echo "export RX_TARGET=windows HOOKSHOT_MINGW=$LLVM_MINGW" >> "$BASH_ENV"
      - run:
          name: NVIDIA DLSS SDK (this run only)
          command: python3 -I scripts/ngx_sdk.py --platform windows --build-only --accept-nvidia-license /tmp/ngx-sdk
      - run:
          name: hookshot_vk.dll with NVIDIA DLSS and AMD FSR 4
          no_output_timeout: 45m
          environment:
            RX_VK_ONLY: "1"
            RX_RELEASE: "1"
            HOOKSHOT_FSR: "1"
          command: |
            set -euo pipefail
            OOT_WORK=/tmp/vk-work RX_CPM="$PWD/_deps/cpm" HOOKSHOT_NGX_SDK=/tmp/ngx-sdk \
              python3 -I nx2/build.py --standalone --jobs "$(nproc)" | tee /tmp/vk-build.log
            test "${PIPESTATUS[0]}" -eq 0
            grep -q "with NVIDIA DLSS" /tmp/vk-build.log
            grep -q "with AMD FSR 4" /tmp/vk-build.log
      - run:
          name: Imports must stay Windows-only
          command: |
            set -euo pipefail
            dll=/tmp/vk-work/sa/build/hookshot_vk.dll
            "$HOOKSHOT_MINGW/bin/llvm-objdump" -p "$dll" | sed -n 's/^ *\tDLL Name: //p' | tr -d '\r' | sort -u > /tmp/imports.txt
            if grep -viE '^(kernel32|user32|gdi32|advapi32)\.dll$|^api-ms-win-crt-[a-z0-9-]+\.dll$' /tmp/imports.txt; then
              echo "unexpected DLL imports"; exit 1
            fi

  website:
    executor: node22
