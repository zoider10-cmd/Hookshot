  website-deploy:
    executor: node22
    steps:
      # plain checkout: this job holds cloudflare-prod and only runs on main, never on PR or fork code
      - checkout
      - run:
          name: wrangler deploy (production)
          working_directory: website
          command: |
            set -euo pipefail
            npm ci --no-audit --no-fund
            npm run build
            # dry-run until cutover: Forgejo's website.yml is still the live deployer (docs/ci.md)
            if [ "<< pipeline.parameters.release_dry_run >>" = true ]; then
              npx wrangler deploy --dry-run --message "main @ ${CIRCLE_SHA1:0:12}"
              exit 0
            fi
            npx wrangler deploy --message "main @ ${CIRCLE_SHA1:0:12}"
            # UNCONFIRMED: circleci run release / deploy tracking until a live pipeline with credentials.
      - run:
          name: Record deploy marker (advisory)
