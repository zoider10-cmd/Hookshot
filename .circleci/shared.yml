          root: .
          paths:
            - dist

  release-stage:
    executor: small
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Collect release artifacts into files/
          command: |
            set -euo pipefail
            . release.env
            if [ -z "${TAG:-}" ]; then
              circleci-agent step halt
            fi
            rm -rf files
            mkdir -p files
            shopt -s nullglob
            for f in build-linux/Hookshot-"$TAG"-x86_64.AppImage build-linux/*.AppImage; do
              if [ -f "$f" ]; then
                cp -a "$f" "files/Hookshot-${TAG}-x86_64.AppImage"
                break
              fi
            done
            for f in dist/HookshotBuilder-"$TAG"-windows-x64.zip dist/*.zip; do
              if [ -f "$f" ]; then
                cp -a "$f" "files/HookshotBuilder-${TAG}-windows-x64.zip"
                break
              fi
            done
            cp -a tools.lock files/
            ls -la files/
      - persist_to_workspace:
          root: .
          paths:
            - files
            - release.env
