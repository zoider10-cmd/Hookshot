            if [ -z "${TAG:-}" ]; then circleci-agent step halt; fi
            export HOOKSHOT_VERSION="$TAG"
            scripts/linux/deps.sh
            python3 -I scripts/tools.py install build-linux/tools --system linux-x64
            scripts/linux/appimage.sh
            ls -l build-linux/*.AppImage
