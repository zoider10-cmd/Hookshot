            echo '5bf340ba6acb314c703c2492a3a6e1530d7cdbfd3b5bf86788ee8b4afefd3573  /tmp/dotnet.tar.gz' | sha256sum -c --strict
            mkdir -p "$HOME/.dotnet" && tar -xzf /tmp/dotnet.tar.gz -C "$HOME/.dotnet"
