  release-version:
    executor: small
    steps:
      - checkout:
          method: full
      - fetch-release-history
      - main-release-py
      - run:
          name: Version (release.yml)
          command: |
            set -euo pipefail
            if ! python3 -I scripts/tools.py check --require; then
              echo "tools.lock lacks a required builder tool (RELEASING.md)"
              exit 1
            fi
            ref=$(git rev-parse HEAD)
            tag=""
            checked=""
            if [ -n "${CIRCLE_TAG:-}" ]; then
              tag="${CIRCLE_TAG}"
              python3 -I "$MAIN_RELEASE_PY" check-tag "$tag" --main origin/main
              checked=$(python3 -I "$MAIN_RELEASE_PY" released-as "$ref" --not "$tag")
              if [ -n "$checked" ] && [[ "$tag" == v* ]] && [[ "$tag" != *-rc.* ]] && [[ "$checked" == *-rc.* ]]; then
                checked=""
              fi
              if [ -n "$checked" ] && [[ "$tag" == v* ]] && [[ "$checked" != v* ]]; then
                checked=""
              fi
            elif [ "<< pipeline.parameters.nightly >>" = true ]; then
              head=$(git rev-parse origin/main)
              if [ "$head" != "$ref" ]; then
                echo "main moved on: skip nightly for $ref"
                tag=""
              else
                last=$(git tag -l 'nightly-*' --sort=-version:refname | head -1)
                if [ -n "$last" ] && git diff --quiet "${last}^{commit}" HEAD -- . ':(exclude)docs/**' ':(exclude)*.md'; then
                  echo "no shipped changes since $last"
                  tag=""
                else
                  tag=$(python3 -I "$MAIN_RELEASE_PY" nightly-name)
                fi
              fi
            fi
            {
              echo "TAG=$tag"
              echo "REF=$ref"
              echo "CHECKED=$checked"
            } | tee release.env
      - persist_to_workspace:
          root: .
          paths:
            - release.env
            - tools.lock

  release-linux:
