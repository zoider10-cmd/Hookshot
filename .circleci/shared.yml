            rel_tag="${TAG}"
            VERSION=0.0.0 # a nightly (or anything but vX.Y.Z[-rc.N]) builds as 0.0.0, as build-windows.yml
            if [[ "$rel_tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$ ]]; then VERSION="${BASH_REMATCH[1]}"; fi
            "$LLVM_MINGW/bin/x86_64-w64-mingw32-windres" builder/setup/setup.rc -O coff -o /tmp/setup_rc.o
            "$LLVM_MINGW/bin/x86_64-w64-mingw32-clang" -O2 -mwindows -municode builder/setup/setup.c /tmp/setup_rc.o \
              -lwinhttp -lbcrypt -lcomctl32 -lshell32 -lole32 -Wl,--dependent-load-flag=0x800 -o /tmp/HookshotBuilder-Setup.exe
            dotnet publish builder/HookshotBuilder/HookshotBuilder.csproj --configuration Release --runtime win-x64 \
