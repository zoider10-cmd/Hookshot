# Every game-free check, on every pull request to main and every push to it: tests/run_all.py runs each
# tests/test_*.py and nx2/test_*.py (all of them, even after a failure), the C++ unit tests under gpu/vk/tests and a
# byte-compile of every tracked Python file, and writes a table of them to the run's summary. A check that needs a GPU,
# the game or MSVC says so, and why, in its own file (RUN_ALL_SKIP). No game data is involved.
# Each system runs the tests in two parts at once (run_all.py --shard, split by tests/run_all_times.json): each part is
# one job, and every check is in exactly one of them. Windows' own build checks (MSVC, the Builder) are in its part 1.
# On Linux the C and C++ compiles go through ccache (the compilers in its PATH), with the cache main's runs leave
# (actions/cache: read by every run, written only by a push to main, so a pull request never writes what another reads).
name: Game-free source regressions

# (Mako: inherited from Hookshot; run by hand only, so a push or a tag publishes nothing by itself)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python source checks (${{ matrix.os }}${{ matrix.shard != '1/1' && format(', part {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shard: 1/2
          - os: ubuntu-24.04
            shard: 2/2
          - os: windows-2022
            shard: 1/2
          - os: windows-2022
            shard: 2/2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # (the versions scripts/linux/deps.sh builds the Vulkan back end with)
      - name: Check out pinned SPIR-V headers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: 04f10f650d514df88b76d25e83db360142c7b174 # vulkan-sdk-1.4.341.0
          path: _deps/spirv-headers
          persist-credentials: false
      - name: Check out pinned Vulkan headers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: 74d8a6cb930c68ef617b202c3ff3c59d919e086b # v1.4.345
          path: _deps/vulkan-headers
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # (the packages tests import: nx2/test_nup_codec.py's zstandard; tests/test_prompt_guide_lines.py's Pillow and numpy,
      # nx2/prompt_assets.py's, pinned as nx2/prompt_requirements.txt and requirements.txt have them. The runner itself needs none)
      - name: Python packages for the tests
        run: python -m pip install --disable-pip-version-check --no-deps zstandard==0.25.0 pillow==13.0.0 numpy==2.5.4
      - name: Compilers and the SPIR-V validator
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ clang spirv-tools ccache
      # (the cache's key: the compilers' versions and the shader recompiler's sources, the objects worth keeping: the
      # bake and nx2 checks compile its ~164 files. A key already cached is not saved again)
      - name: Compiler cache
        if: runner.os == 'Linux'
        id: ccache
        env:
          RECOMPILER: ${{ hashFiles('gpu/vk/eden/**', 'gpu/vk/sirit/**', 'gpu/vk/compat/**', 'gpu/compat/**', 'gpu/shaderbatch.cpp') }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p "$RUNNER_TEMP/ccache-bin"
          for c in cc c++ gcc g++ clang clang++; do ln -sf "$(command -v ccache)" "$RUNNER_TEMP/ccache-bin/$c"; done
          echo "$RUNNER_TEMP/ccache-bin" >> "$GITHUB_PATH"
          {
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_MAXSIZE=400M"
          } >> "$GITHUB_ENV"
          compilers=$( { clang++ --version; g++ --version; } | sha256sum | cut -c1-16)
          prefix="ccache-tests-linux-part${SHARD%/*}-$compilers-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$RECOMPILER" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'Linux'
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache.outputs.key }}
          restore-keys: ${{ steps.ccache.outputs.prefix }}
      - name: Pinned glslang for generated shader comparisons
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The checked-in shader headers are generated with glslang16.6.0.
          # Older distro compilers can lower discard differently even for unchanged GLSL.
          tool_dir="$RUNNER_TEMP/glslang-16.6.0"
          mkdir -p "$tool_dir"
          curl -fL --retry 3 -o "$tool_dir/glslang.tar.gz" https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-linux-x86_64-release.tar.gz
          echo '2c34071f56ecf39d16233294d3739cf43f981fd39080f2fd9dccb782101191ce  '"$tool_dir/glslang.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/glslang.tar.gz" -C "$tool_dir"
          "$tool_dir/bin/glslangValidator" --version
          echo "$tool_dir/bin" >> "$GITHUB_PATH"

      # (the steps below all run when one before them failed, so one run shows every failure)
      - name: Check Windows native source regressions
        if: ${{ !cancelled() && runner.os == 'Windows' && matrix.shard == '1/2' }}
        shell: cmd
        run: |
          @echo off
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (
            echo Visual Studio locator not found.
            exit /b 1
          )
          set "VSROOT="
          for /f "usebackq delims=" %%i in (`call "%VSWHERE%" -latest -products * -version "[17.0,18.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT (
            echo Visual Studio 2022 C++ tools not found.
            exit /b 1
          )
          if not exist "%VSROOT%\Common7\Tools\VsDevCmd.bat" (
            echo Visual Studio developer command prompt not found.
            exit /b 1
          )
          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /W4 /WX /EHsc /Fo"%TEMP%\present_rect_test.obj" /Fe:"%TEMP%\present_rect_test.exe" gpu\vk\tests\present_rect_test.cpp
          if errorlevel 1 exit /b 1
          "%TEMP%\present_rect_test.exe"
          if errorlevel 1 exit /b 1
          python -I -B tests/test_invalidate_vcore.py --cxx cl
          if errorlevel 1 exit /b 1
      - name: Set up .NET for Windows Builder checks
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'
      - name: Check Windows Builder worker delivery
        if: ${{ !cancelled() && runner.os == 'Windows' && matrix.shard == '1/2' }}
        shell: pwsh
        run: |
          dotnet restore tests/builder_workers/BuilderWorkersTests.csproj --configfile tests/builder_workers/NuGet.Config
          dotnet run --project tests/builder_workers/BuilderWorkersTests.csproj --configuration Release --no-restore -- (Get-Command python).Source
      - name: Compile Windows Builder
        if: ${{ !cancelled() && runner.os == 'Windows' && matrix.shard == '1/2' }}
        run: dotnet build builder/HookshotBuilder/HookshotBuilder.csproj --configuration Debug -p:NuGetAudit=false
      # (--strict: a check whose compiler, headers or package is missing here fails instead of being skipped)
      - name: Every test
        if: ${{ !cancelled() }}
        env:
          HOOKSHOT_SPIRV_HEADERS: ${{ github.workspace }}/_deps/spirv-headers/include
          HOOKSHOT_VULKAN_HEADERS: ${{ github.workspace }}/_deps/vulkan-headers/include
          SHARD: ${{ matrix.shard }}
        run: python -I -B tests/run_all.py --strict --shard ${{ env.SHARD }}
      - name: Compiler cache statistics
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: ccache --show-stats
      - if: ${{ !cancelled() && runner.os == 'Linux' && github.event_name == 'push' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache.outputs.key }}

  # (the focused shader recompiler fixtures, in one job: they build the same recompiler sources, through ccache with the
  # cache main's runs leave, as the Python checks' above; the direct surface atomic fixture takes the objects the global
  # load/store one made. The F2I fixture's steps run whether or not the others passed, as when it was a job of its own)
  spirv-fixtures:
    name: SPIR-V fixtures (global narrow load/store, direct surface atomics, F2I immediate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned SPIR-V headers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhronosGroup/SPIRV-Headers
          ref: 496543121ce6419f23d6fa5d7194ba66c36212d2
          path: _deps/spirv-headers
          persist-credentials: false
      - name: Install Clang C++20, SPIR-V validator and ccache
        run: sudo apt-get update && sudo apt-get install -y clang spirv-tools ccache
      - name: Compiler cache
        id: ccache
        env:
          RECOMPILER: ${{ hashFiles('gpu/vk/eden/**', 'gpu/vk/sirit/**', 'gpu/vk/compat/**', 'gpu/compat/**') }}
        run: |
          {
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_MAXSIZE=400M"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"
          prefix="ccache-spirv-fixtures-$(clang++ --version | sha256sum | cut -c1-16)-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$RECOMPILER" >> "$GITHUB_OUTPUT"
      - id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache.outputs.key }}
          restore-keys: ${{ steps.ccache.outputs.prefix }}
      - name: Configure the focused real-IR fixture
        run: >-
          CC=clang CXX=clang++ cmake -S tests/global_load_16 -B ${{ runner.temp }}/global-load-16
          -DREPO_ROOT=${{ github.workspace }}
          -DSPIRV_HEADERS_ROOT=${{ github.workspace }}/_deps/spirv-headers
      - name: Build the focused fixture
        run: cmake --build ${{ runner.temp }}/global-load-16 --parallel "$(nproc)"
      - name: Emit and inspect real IR modules
        run: ${{ runner.temp }}/global-load-16/global_load_16_ir ${{ runner.temp }}/global-load-16/modules
      - name: Check real-IR compare-exchange loop contracts
        env:
          RX_VK_FOLLOW_STORES: '1'
        run: ${{ runner.temp }}/global-load-16/global_load_16_ir --cas-loops ${{ runner.temp }}/global-load-16/modules
      - name: Validate every emitted module
        shell: bash
        # (--uniform-buffer-standard-layout: the back end's device has uniformBufferStandardLayout, gpu/vk/vk_main.cpp
        # creates it with every feature the GPU reports, so constant buffers are u32 arrays of stride 4)
        run: |
          for module in "${{ runner.temp }}"/global-load-16/modules/*.spv; do
            spirv-val --target-env vulkan1.3 --uniform-buffer-standard-layout "$module"
          done
      - name: Configure the authored direct surface atomic fixture
        run: >-
          CC=clang CXX=clang++ cmake -S tests/native_suatom -B ${{ runner.temp }}/native-suatom
          -DREPO_ROOT=${{ github.workspace }}
          -DSPIRV_HEADERS_ROOT=${{ github.workspace }}/_deps/spirv-headers
      - name: Build the direct surface atomic fixture
        run: cmake --build ${{ runner.temp }}/native-suatom --parallel "$(nproc)"
      - name: Translate authored direct surface atomic programs
        run: ${{ runner.temp }}/native-suatom/native_suatom ${{ runner.temp }}/native-suatom/modules
      - name: Validate every direct surface atomic module
        shell: bash
        run: |
          for module in "${{ runner.temp }}"/native-suatom/modules/*.spv; do
            spirv-val --target-env vulkan1.3 "$module"
          done
      - name: Build the F2I immediate fixture
        id: f2i
        if: ${{ !cancelled() }}
        run: |
          CC=clang CXX=clang++ cmake -S tests/f2i_immediate -B "${{ runner.temp }}/f2i" -DREPO_ROOT="${{ github.workspace }}" -DSPIRV_HEADERS_ROOT="${{ github.workspace }}/_deps/spirv-headers"
          cmake --build "${{ runner.temp }}/f2i" --parallel "$(nproc)"
      - name: Emit and validate the F2I immediate modules
        if: ${{ !cancelled() && steps.f2i.outcome == 'success' }}
        run: |
          "${{ runner.temp }}/f2i/f2i_immediate" "${{ runner.temp }}/f2i/modules"
          for module in "${{ runner.temp }}"/f2i/modules/*.spv; do
            spirv-val --target-env vulkan1.3 --uniform-buffer-standard-layout "$module"
          done
      - name: Compiler cache statistics
        if: ${{ !cancelled() }}
        run: ccache --show-stats
      - if: ${{ !cancelled() && github.event_name == 'push' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache.outputs.key }}

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # (the release's own binary, checked against its published SHA-256; shellcheck from the runner image checks the
      # run: scripts)
      - name: actionlint 1.7.12
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL --retry 5 --retry-delay 10 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Lint the workflows
        run: '"$RUNNER_TEMP/actionlint" -color'
